<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FDE Learning</title>
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Light by default; apply a saved choice before first paint.
      (function () {
        var t = null;
        try { t = localStorage.getItem("fde.theme"); } catch (e) {}
        var theme = t === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0b0b10");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
