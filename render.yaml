services:
  - type: web
    name: fde-learning-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: VOICE_WORKER_KEY
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false
      - key: TEACHER_EMAILS
        sync: false
      - key: MATERIAL_MAX_MB
        sync: false
      - key: QUIZ_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COACH_MODEL
        sync: false
      - key: GRADER_GITHUB_TOKEN
        sync: false
      - key: GRADER_REPO
        sync: false
      - key: GRADER_CALLBACK_KEY
        sync: false
